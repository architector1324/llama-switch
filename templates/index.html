<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama Switch</title>
    <link rel="stylesheet" href="/static/css/style.css?v=11">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <header class="header">
            <div class="logo">llama-switch</div>
            <nav class="nav">
                <button id="theme-toggle" title="Switch Theme"></button>
                <div class="status-indicator" id="global-status"></div>
            </nav>
        </header>

        <main class="main-content">
            <section class="panel models-panel">
                <div class="panel-header">
                    <h2>Models</h2>
                    <div class="actions">
                        <button class="btn btn-danger" onclick="stopServer()">Stop All</button>
                    </div>
                </div>
                <div class="section-tabs" id="section-tabs"></div>
                <div class="model-list-header">
                    <span>Model ID</span>
                    <span>Action</span>
                </div>
                <div id="model-list" class="model-list">
                    <div class="loading">Loading configuration...</div>
                </div>
            </section>

            <section class="right-column">
                <div class="panel controls-panel">
                    <div class="panel-header">
                        <h2>Dashboard</h2>
                    </div>
                    
                    <div class="dashboard-grid">
                        <div class="dash-column stats-column">
                            <div id="stats-llm">
                                <div class="stat-row">
                                    <div class="stat-box">
                                        <span class="label">Gen Speed</span>
                                        <span class="value" id="stat-gen-speed">-</span>
                                    </div>
                                    <div class="stat-box">
                                        <span class="label">Prompt Speed</span>
                                        <span class="value" id="stat-prompt-speed">-</span>
                                    </div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-box">
                                        <span class="label">Ctx Usage</span>
                                        <span class="value" id="stat-ctx-usage">-</span>
                                    </div>
                                    <div class="stat-box">
                                        <span class="label">Total Tokens</span>
                                        <span class="value" id="stat-total-tokens">-</span>
                                    </div>
                                </div>
                            </div>
                            <div id="stats-sd" style="display: none;">
                                <div class="stat-row">
                                    <div class="stat-box">
                                        <span class="label">Step Time</span>
                                        <span class="value" id="stat-sd-speed">-</span>
                                    </div>
                                    <div class="stat-box">
                                        <span class="label">Last Image</span>
                                        <span class="value" id="stat-sd-last">-</span>
                                    </div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-box">
                                        <span class="label">Progress</span>
                                        <span class="value" id="stat-sd-progress">-</span>
                                    </div>
                                    <div class="stat-box">
                                        <span class="label">Images</span>
                                        <span class="value" id="stat-sd-images">-</span>
                                    </div>
                                </div>
                            </div>
                            <div id="stats-tts" style="display: none;">
                                <div class="stat-row">
                                    <div class="stat-box">
                                        <span class="label">Speed</span>
                                        <span class="value" id="stat-tts-rtf">-</span>
                                    </div>
                                    <div class="stat-box">
                                        <span class="label">Last Clip</span>
                                        <span class="value" id="stat-tts-last">-</span>
                                    </div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-box">
                                        <span class="label">Frames</span>
                                        <span class="value" id="stat-tts-frames">-</span>
                                    </div>
                                    <div class="stat-box">
                                        <span class="label">Clips</span>
                                        <span class="value" id="stat-tts-clips">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="dash-column settings-column">
                            <div class="control-group compact-group" id="ctx-control">
                                <label for="ctx-input">Context Window</label>
                                <div class="input-wrapper">
                                    <input type="number" id="ctx-input" value="4096" min="512" step="512">
                                    <button id="apply-ctx-btn" class="btn btn-primary btn-sm" onclick="applyContextChange()">Apply</button>
                                </div>
                            </div>

                            <div class="control-group compact-group" id="preserve-think-control">
                                <label for="preserve-think-input" title="Pull the reasoning of earlier assistant turns back into the prompt. Off means every turn starts from a clean slate. Applied when the model loads, so toggling reloads it.">Preserve Thinking</label>
                                <div class="input-wrapper">
                                    <label class="switch">
                                        <input type="checkbox" id="preserve-think-input" onchange="applyPreserveThinkChange()">
                                        <span class="switch-track"><span class="switch-thumb"></span></span>
                                    </label>
                                    <span class="switch-state" id="preserve-think-state">Off</span>
                                </div>
                            </div>

                            <div class="control-group compact-group" id="frames-control" style="display: none;">
                                <label for="frames-input" title="Audio frames, 12.5 per second. 2048 caps a clip at about 164 s; longer text is cut off mid-sentence.">Max Frames</label>
                                <div class="input-wrapper">
                                    <input type="number" id="frames-input" value="2048" min="64" step="256">
                                    <button id="apply-frames-btn" class="btn btn-primary btn-sm" onclick="applyFramesChange()">Apply</button>
                                </div>
                            </div>


                            <div class="control-group compact-group" id="res-control" style="display: none;">
                                <label for="res-input" title="Output size for image models. Applied when the model loads, so changing it reloads it. Only profiles written with ${WIDTH}/${HEIGHT} follow it.">Output Size</label>
                                <div class="input-wrapper">
                                    <select id="res-input" class="res-select" onchange="applyResChange()">
                                        <optgroup label="1 MP">
                                            <option value="1024x1024">1024x1024 [1:1]</option>
                                            <option value="848x1264">848x1264 [2:3]</option>
                                            <option value="1264x848">1264x848 [3:2]</option>
                                            <option value="768x1376">768x1376 [9:16]</option>
                                            <option value="896x1200">896x1200 [3:4]</option>
                                            <option value="1376x768">1376x768 [16:9]</option>
                                            <option value="1200x896">1200x896 [4:3]</option>
                                        </optgroup>
                                        <optgroup label="4 MP">
                                            <option value="2048x2048">2048x2048 [1:1]</option>
                                            <option value="2400x1792">2400x1792 [4:3]</option>
                                            <option value="1792x2400">1792x2400 [3:4]</option>
                                            <option value="2528x1696">2528x1696 [3:2]</option>
                                            <option value="1696x2528">1696x2528 [2:3]</option>
                                            <option value="2752x1536">2752x1536 [16:9]</option>
                                            <option value="1536x2752">1536x2752 [9:16]</option>
                                        </optgroup>
                                    </select>
                                </div>
                            </div>

                            <div class="control-group compact-group" id="hires-control" style="display: none;">
                                <label for="hires-input" title="Second pass at twice the size. The first pass keeps Output Size, so the result is 2x it. Each profile carries its own hires settings; this only switches them on. Applied when the model loads, so toggling reloads it.">Hires Fix</label>
                                <div class="input-wrapper">
                                    <label class="switch">
                                        <input type="checkbox" id="hires-input" onchange="applyHiresChange()">
                                        <span class="switch-track"><span class="switch-thumb"></span></span>
                                    </label>
                                    <span class="switch-state" id="hires-state">Off</span>
                                </div>
                            </div>

                            <div class="stat-box status-box">
                                <span class="label">Current Model</span>
                                <span class="value primary-text" id="current-model">-</span>
                                
                                <div class="status-row">
                                    <span id="status-text">Stopped</span>
                                </div>
                                <a id="webui-btn" href="#" target="_blank" class="btn btn-primary btn-sm" style="display: none;">Open WebUI</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel logs-panel">
                    <div class="panel-header">
                        <h2>Upstream Logs</h2>
                        <div class="actions">
                            <button id="clear-logs-btn" class="icon-btn">Clear</button>
                            <button id="scroll-logs-btn" class="icon-btn">⬇</button>
                        </div>
                    </div>
                    <div id="logs-container" class="logs-container">
                        <div class="log-line">Waiting for logs...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/js/app.js?v=11"></script>
</body>
</html>
